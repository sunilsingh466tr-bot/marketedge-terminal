name: Build and Deploy to GitHub Pages

on:
  schedule:
    # 16:30 IST (11:00 UTC) Mon-Fri — first post-close EOD run
    - cron: '0 11 * * 1-5'
    # 18:30 IST (13:00 UTC) Mon-Fri — second post-close EOD run
    - cron: '0 13 * * 1-5'
    # 21:00 IST (15:30 UTC) Mon-Fri — late evening EOD catch-up run
    - cron: '30 15 * * 1-5'
    # 08:00 IST (02:30 UTC) Mon-Sat — morning catch-up run before market open
    - cron: '30 2 * * 1-6'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static market data (fails loudly if stale)
        env:
          YAHOO_WORKER_URL: ${{ vars.YAHOO_WORKER_URL }}
        run: node scripts/build-static-data.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
